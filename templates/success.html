<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verified • Instagram</title>
<link rel="icon" href="https://www.instagram.com/favicon.ico">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fafafa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 8px;
    width: 100%;
    max-width: 400px;
    padding: 48px 32px 40px;
    text-align: center;
  }
  .tick-wrap { width: 96px; height: 96px; margin: 0 auto 28px; position: relative; }
  .tick-circle {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: #e8f5e9;
    display: flex; align-items: center; justify-content: center;
    animation: pop 0.35s cubic-bezier(.2,.8,.4,1.2) forwards;
  }
  .tick-circle svg {
    width: 52px; height: 52px;
    stroke: #2ecc71;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    animation: draw 0.5s 0.15s ease forwards;
  }
  @keyframes pop {
    0% { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  h1 { font-size: 22px; color: #262626; font-weight: 600; margin-bottom: 10px; }
  p { font-size: 14px; color: #8e8e8e; line-height: 1.5; margin-bottom: 6px; }
  .redirect-note { font-size: 12px; color: #b0b0b0; margin-top: 24px; }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #dbdbdb;
    border-top-color: #0095f6;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="tick-wrap">
    <div class="tick-circle">
      <svg viewBox="0 0 52 52">
        <polyline points="14,27 23,36 39,18" />
      </svg>
    </div>
  </div>
  <h1>Verified</h1>
  <p>Your identity has been successfully confirmed.</p>
  <p>Redirecting you to Instagram…</p>
  <div class="redirect-note">
    <span class="spinner"></span>Opening app…
  </div>
</div>

<script>
(function () {
  var fallbackUrl = "https://www.instagram.com/accounts/login/";
  var appScheme = "instagram://app";
  var opened = false;

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) opened = true;
  });
  window.addEventListener("blur", function () { opened = true; });

  setTimeout(function () {
    window.location.href = appScheme;
    setTimeout(function () {
      if (!opened && !document.hidden) {
        window.location.href = fallbackUrl;
      }
    }, 1200);
  }, 1400);
})();
</script>
</body>
</html>
